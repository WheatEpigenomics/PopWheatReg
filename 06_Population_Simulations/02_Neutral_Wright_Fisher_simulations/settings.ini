[input]
gff3 = genes.gff3
real_blocks_bed = observed_blocks.bed

[analysis]
chromosomes = 1A,1B,1D,2A,2B,2D,3A,3B,3D,4A,4B,4D,5A,5B,5D,6A,6B,6D,7A,7B,7D
run_chromosomes = 1A,1B,1D,2A,2B,2D,3A,3B,3D,4A,4B,4D,5A,5B,5D,6A,6B,6D,7A,7B,7D
promoter_bp = 3000
evaluation_groups = all_significant
max_block_bp = 10000000
real_blocks_coordinate_mode = one_based_inclusive
distance_bins_bp = 0,10000,20000,50000,100000,250000,500000,750000,1000000

[random_aglink_null]
distance_caliper_fraction = 0.08
n_random_sets = 1000
min_candidates_per_edge = 5
short_distance_threshold_bp = 50000
short_min_candidates_per_edge = 3
short_candidate_pool_size = 5
base_seed = 20260925
exclude_known_partners = true

[simulation]
population_size = 203
output_sample_size = 203
checkpoints = 10,20,50,100,200
replicates = 30
recomb_rate_per_bp = 1e-8
selfing_rate = 0.95
threads = 1
base_seed = 20260923
task_table_filename = neutral_task_table.tsv

[plink]
memory_mb = 1024
threads = 1
block_args = --blocks no-pheno-req no-small-max-span --blocks-min-maf 0.02 --blocks-strong-lowci 0.62 --blocks-strong-highci 0.92 --blocks-recomb-highci 0.92 --blocks-inform-frac 0.80
block_max_kb_1a = 9000
block_max_kb_1b = 10000
block_max_kb_1d = 15000
block_max_kb_2a = 9000
block_max_kb_2b = 10000
block_max_kb_2d = 15000
block_max_kb_3a = 9000
block_max_kb_3b = 10000
block_max_kb_3d = 15000
block_max_kb_4a = 9000
block_max_kb_4b = 10000
block_max_kb_4d = 15000
block_max_kb_5a = 9000
block_max_kb_5b = 10000
block_max_kb_5d = 15000
block_max_kb_6a = 9000
block_max_kb_6b = 10000
block_max_kb_6d = 15000
block_max_kb_7a = 9000
block_max_kb_7b = 10000
block_max_kb_7d = 15000
makebed_args = --make-bed
allow_extra_chr = true

[ld_qc]
enabled = true
pairs_per_bin = 1000
bins_bp = 0,20000,50000,100000,250000,500000,750000,1000000,2000000
seed = 20260924

[output]
keep_checkpoint_vcf = false
keep_plink_binary = false
keep_plink_log = false

[background]
context_bp = 2000000
min_recomb_coverage = 0.5
match_caliper_sd = 0.2

